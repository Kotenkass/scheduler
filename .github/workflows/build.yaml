name: Build, Push, and Deploy Docker Image

on: [push]

jobs:
  build:
    runs-on:
      - self-hosted
      - linux
      - k8s
      - scheduler

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ secrets.DOCKER_HUB_USERNAME }}/scheduler
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    runs-on: ubuntu-latest
    needs: build

    env:
      MANIFEST_PATH: manifest.yaml
      KUBECONFIG: /tmp/kubeconfig
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      USER_SERVICE_URL: ${{ secrets.USER_SERVICE_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Prepare kubeconfig
        run: |
          mkdir -p "$(dirname "$KUBECONFIG")"
          echo "${{ secrets.KUBECONFIG_BASE64 }}" | base64 --decode > "$KUBECONFIG"
          chmod 600 "$KUBECONFIG"
          kubectl --kubeconfig "$KUBECONFIG" auth can-i get pods --all-namespaces

      - name: Create or update scheduler environment Secret
        run: |
          kubectl --kubeconfig "$KUBECONFIG" create secret generic scheduler-env \
            --from-literal=TELEGRAM_TOKEN="$TELEGRAM_TOKEN" \
            --from-literal=REDIS_URL="$REDIS_URL" \
            --from-literal=USER_SERVICE_URL="$USER_SERVICE_URL" \
            --dry-run=client -o yaml | kubectl --kubeconfig "$KUBECONFIG" apply -f -

      - name: Apply Manifest
        run: kubectl --kubeconfig "$KUBECONFIG" apply -f "$MANIFEST_PATH"

      - name: Set Docker image
        run: kubectl --kubeconfig "$KUBECONFIG" set image deployment/scheduler-deployment scheduler="docker.io/${{ secrets.DOCKER_HUB_USERNAME }}/scheduler:latest"

      - name: Restart Deployment
        run: kubectl --kubeconfig "$KUBECONFIG" rollout restart deployment scheduler-deployment
