apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler
  labels:
    app: scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scheduler
  template:
    metadata:
      labels:
        app: scheduler
    spec:
      containers:
        - name: scheduler
          image: docker.io/anikolaevdo/scheduler:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: scheduler-env
                  key: REDIS_URL
            - name: USER_SERVICE_URL
              valueFrom:
                secretKeyRef:
                  name: scheduler-env
                  key: USER_SERVICE_URL
