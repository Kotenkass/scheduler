apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler-deployment
  labels:
    app: scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scheduler
  template:
    metadata:
      labels:
        app: scheduler
    spec:
      containers:
        - name: scheduler
          image: docker.io/Kotenkass/scheduler:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: REDIS_ADDR
              valueFrom:
                secretKeyRef:
                  name: scheduler-env
                  key: REDIS_ADDR
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: scheduler-env
                  key: REDIS_PASSWORD
                  optional: true
            - name: REDIS_DB
              valueFrom:
                secretKeyRef:
                  name: scheduler-env
                  key: REDIS_DB
                  optional: true
